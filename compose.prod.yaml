# Боевой стенд: https://pavelpetrov.tech
# Запуск на сервере: docker compose -f compose.prod.yaml --env-file .env.prod up -d --build
# Изображения хранятся во внешнем S3 (общий бакет, префикс stroykontrol/), MinIO здесь не нужен.
name: stroykontrol

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: stroykontrol
      POSTGRES_USER: stroykontrol
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?задайте POSTGRES_PASSWORD в .env.prod}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stroykontrol -d stroykontrol"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    env_file: .env.prod
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql+psycopg://stroykontrol:${POSTGRES_PASSWORD}@postgres:5432/stroykontrol
      FRONTEND_ORIGINS: https://${DOMAIN:?задайте DOMAIN в .env.prod}
      SESSION_COOKIE_SECURE: "true"
      S3_ENABLED: "true"
      MAIL_LOGIN_URL: https://${DOMAIN}/#/login
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "8000"

  frontend:
    build:
      context: .
      dockerfile: prototype/Dockerfile
    restart: unless-stopped
    depends_on:
      - backend
    expose:
      - "80"

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:?задайте ACME_EMAIL в .env.prod}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - frontend

volumes:
  postgres-data:
  caddy-data:
  caddy-config:
